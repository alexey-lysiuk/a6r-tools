<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tinySA Ultra Remote Control</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iMyIgZmlsbD0iIzFlMWUxZSIvPgogIDxwb2x5bGluZSBmaWxsPSJub25lIiBzdHJva2U9IiNmZmQ3MDAiIHN0cm9rZS13aWR0aD0iMS41IgogICAgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIgogICAgcG9pbnRzPSIxLDI3IDMsMjYgNSwyNCA3LDkgOSwyMyAxMSwyNSAxMywyMCAxNSwxOCAxNywyMiAxOSwyNSAyMSwyNCAyMywxOSAyNSwyMyAyNywyNSAyOSwyNCAzMSwyNiIvPgo8L3N2Zz4=">
    <style>
        :root {
            color-scheme: dark light;
            --body-bg: #1e1e1e;
            --surface-bg: #252525;
            --surface-border: #404040;
            --text: #e0e0e0;
            --muted: #b0b0b0;
            --button-bg: #383838;
            --button-hover: #484848;
            --button-text: #f5f5f5;
            --input-bg: #2f2f2f;
            --input-border: #505050;
            --error: #f08080;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --body-bg: #f0f2f5;
                --surface-bg: #ffffff;
                --surface-border: #b0bcc8;
                --text: #303848;
                --muted: #5d6a7f;
                --button-bg: #3060a0;
                --button-hover: #204080;
                --button-text: #ffffff;
                --input-bg: #ffffff;
                --input-border: #b0bcc8;
                --error: #c02020;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: sans-serif;
            background: var(--body-bg);
            color: var(--text);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.5rem;
        }

        .panel {
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            background: var(--surface-bg);
            padding: 12px;
            margin-bottom: 12px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        button {
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            background: var(--button-bg);
            color: var(--button-text);
            padding: 7px 12px;
            cursor: pointer;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: var(--button-hover);
        }

        input {
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
            padding: 6px 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .screen-wrap {
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            overflow: hidden;
            width: min(960px, 100%);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }

        #status {
            margin-top: 8px;
            min-height: 1.4em;
            color: var(--muted);
            font-size: 0.9rem;
        }

        #status.error {
            color: var(--error);
        }
    </style>
</head>
<body>
    <h1>tinySA Ultra Remote Control</h1>

    <div class="panel">
        <div class="toolbar">
            <button id="connectBtn">Connect</button>
            <button id="disconnectBtn" disabled>Disconnect</button>
            <button id="refreshBtn" disabled>Refresh now</button>
            <label>Auto refresh (ms)
                <input id="intervalInput" type="number" min="200" step="100" value="1000">
            </label>
            <button id="toggleAutoBtn" disabled>Start auto refresh</button>
        </div>
    </div>

    <div class="panel">
        <div class="toolbar">
            <button id="downloadCaptureBtn" disabled>Download screenshot</button>
            <label>Trace file
                <input id="traceNameInput" type="text" value="scan.csv" size="18">
            </label>
            <button id="downloadTraceBtn" disabled>Download trace file</button>
        </div>
    </div>

    <div class="panel">
        <div class="toolbar">
            <label>Start (Hz)
                <input id="startFreqInput" type="number" min="1" step="1" value="100000000">
            </label>
            <label>Stop (Hz)
                <input id="stopFreqInput" type="number" min="1" step="1" value="200000000">
            </label>
            <label>RBW (Hz)
                <input id="rbwInput" type="number" min="1" step="1" value="30000">
            </label>
            <button id="applySweepBtn" disabled>Apply sweep settings</button>
        </div>
    </div>

    <div class="screen-wrap">
        <canvas id="screen" width="480" height="320" role="img" aria-label="tinySA Ultra screen"></canvas>
    </div>

    <div id="status">WebSerial disconnected.</div>

    <script>
        const SCREEN_WIDTH = 480;
        const SCREEN_HEIGHT = 320;
        const PIXEL_BYTES = SCREEN_WIDTH * SCREEN_HEIGHT * 2;
        const TEXT_ENCODER = new TextEncoder();
        const TEXT_DECODER = new TextDecoder();
        const PROMPT = TEXT_ENCODER.encode('ch>');
        const TOUCH_MOVE_INTERVAL_MS = 50;

        let port = null;
        let reader = null;
        let writer = null;
        let readBuffer = new Uint8Array(0);
        let ioQueueTail = Promise.resolve();
        let autoTimer = null;
        let refreshInFlight = false;
        let touchMoveInFlight = false;
        let lastTouchMoveAt = 0;
        let disconnectPromise = null;

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const toggleAutoBtn = document.getElementById('toggleAutoBtn');
        const intervalInput = document.getElementById('intervalInput');
        const downloadCaptureBtn = document.getElementById('downloadCaptureBtn');
        const traceNameInput = document.getElementById('traceNameInput');
        const downloadTraceBtn = document.getElementById('downloadTraceBtn');
        const startFreqInput = document.getElementById('startFreqInput');
        const stopFreqInput = document.getElementById('stopFreqInput');
        const rbwInput = document.getElementById('rbwInput');
        const applySweepBtn = document.getElementById('applySweepBtn');
        const statusEl = document.getElementById('status');
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');

        function setStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.classList.toggle('error', isError);
        }

        function setConnectedUi(connected) {
            connectBtn.disabled = connected;
            disconnectBtn.disabled = !connected;
            refreshBtn.disabled = !connected;
            toggleAutoBtn.disabled = !connected;
            intervalInput.disabled = !connected;
            downloadCaptureBtn.disabled = !connected;
            traceNameInput.disabled = !connected;
            downloadTraceBtn.disabled = !connected;
            startFreqInput.disabled = !connected;
            stopFreqInput.disabled = !connected;
            rbwInput.disabled = !connected;
            applySweepBtn.disabled = !connected;
            toggleAutoBtn.textContent = autoTimer ? 'Stop auto refresh' : 'Start auto refresh';
        }

        function appendBuffer(existing, chunk) {
            const merged = new Uint8Array(existing.length + chunk.length);
            merged.set(existing, 0);
            merged.set(chunk, existing.length);
            return merged;
        }

        function findSequence(buffer, sequence) {
            outer: for (let i = 0; i <= buffer.length - sequence.length; i++) {
                for (let j = 0; j < sequence.length; j++) {
                    if (buffer[i + j] !== sequence[j]) {
                        continue outer;
                    }
                }
                return i;
            }
            return -1;
        }

        function consumeOptionalPromptPrefix() {
            while (readBuffer.length && (readBuffer[0] === 0x0d || readBuffer[0] === 0x0a)) {
                readBuffer = readBuffer.slice(1);
            }
            if (readBuffer.length >= PROMPT.length && findSequence(readBuffer.slice(0, PROMPT.length), PROMPT) === 0) {
                readBuffer = readBuffer.slice(PROMPT.length);
            }
        }

        async function readChunk() {
            const { value, done } = await reader.read();
            if (done) {
                throw new Error('Serial connection closed');
            }
            if (value?.length) {
                readBuffer = appendBuffer(readBuffer, value);
            }
        }

        async function readLine() {
            while (true) {
                const index = readBuffer.indexOf(0x0A);
                if (index !== -1) {
                    const line = readBuffer.slice(0, index + 1);
                    readBuffer = readBuffer.slice(index + 1);
                    return line;
                }
                await readChunk();
            }
        }

        async function readUntilPrompt() {
            while (true) {
                const index = findSequence(readBuffer, PROMPT);
                if (index !== -1) {
                    const data = readBuffer.slice(0, index);
                    readBuffer = readBuffer.slice(index + PROMPT.length);
                    return data;
                }
                await readChunk();
            }
        }

        async function readExact(length) {
            while (readBuffer.length < length) {
                await readChunk();
            }
            const data = readBuffer.slice(0, length);
            readBuffer = readBuffer.slice(length);
            return data;
        }

        async function writeCommand(command) {
            const bytes = TEXT_ENCODER.encode(`${command}\r`);
            await writer.write(bytes);
        }

        function enqueueIo(operation) {
            const operationPromise = ioQueueTail.then(() => operation());
            ioQueueTail = operationPromise.catch(() => {});
            return operationPromise;
        }

        async function sendConsoleCommand(command) {
            await writeCommand(command);
            await readLine();
            const raw = await readUntilPrompt();
            return TEXT_DECODER.decode(raw).trim();
        }

        async function sendBinaryCommand(command) {
            await writeCommand(command);
            await readLine();
            return readUntilPrompt();
        }

        function rgb565ToRgba(color) {
            const r = (color >> 11) & 0x1f;
            const g = (color >> 5) & 0x3f;
            const b = color & 0x1f;
            return [
                (r << 3) | (r >> 2),
                (g << 2) | (g >> 4),
                (b << 3) | (b >> 2)
            ];
        }

        function renderRgb565(rawPixels) {
            const imageData = ctx.createImageData(SCREEN_WIDTH, SCREEN_HEIGHT);
            const rgba = imageData.data;

            for (let src = 0, dst = 0; src < rawPixels.length; src += 2, dst += 4) {
                const word = rawPixels[src] | (rawPixels[src + 1] << 8);
                const [r, g, b] = rgb565ToRgba(word);
                rgba[dst] = r;
                rgba[dst + 1] = g;
                rgba[dst + 2] = b;
                rgba[dst + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function readLe16(buffer, offset) {
            return buffer[offset] | (buffer[offset + 1] << 8);
        }

        function renderBulkRegion(x, y, width, height, rawPixels) {
            if (width <= 0 || height <= 0 || x < 0 || y < 0 || x >= SCREEN_WIDTH || y >= SCREEN_HEIGHT) {
                return;
            }
            const clippedWidth = Math.min(width, SCREEN_WIDTH - x);
            const clippedHeight = Math.min(height, SCREEN_HEIGHT - y);
            const imageData = ctx.createImageData(clippedWidth, clippedHeight);
            const rgba = imageData.data;

            for (let row = 0; row < clippedHeight; row++) {
                for (let col = 0; col < clippedWidth; col++) {
                    const srcPixelIndex = (row * width + col) * 2;
                    const dstPixelIndex = (row * clippedWidth + col) * 4;
                    const word = rawPixels[srcPixelIndex] | (rawPixels[srcPixelIndex + 1] << 8);
                    const [r, g, b] = rgb565ToRgba(word);
                    rgba[dstPixelIndex] = r;
                    rgba[dstPixelIndex + 1] = g;
                    rgba[dstPixelIndex + 2] = b;
                    rgba[dstPixelIndex + 3] = 255;
                }
            }

            ctx.putImageData(imageData, x, y);
        }

        function renderFillRegion(x, y, width, height, color) {
            if (width <= 0 || height <= 0 || x < 0 || y < 0 || x >= SCREEN_WIDTH || y >= SCREEN_HEIGHT) {
                return;
            }
            const clippedWidth = Math.min(width, SCREEN_WIDTH - x);
            const clippedHeight = Math.min(height, SCREEN_HEIGHT - y);
            const [r, g, b] = rgb565ToRgba(color);
            ctx.fillStyle = `rgb(${r} ${g} ${b})`;
            ctx.fillRect(x, y, clippedWidth, clippedHeight);
        }

        function hasToken(buffer, offset, token) {
            const tokenBytes = TEXT_ENCODER.encode(token);
            if (offset + tokenBytes.length > buffer.length) {
                return false;
            }
            for (let i = 0; i < tokenBytes.length; i++) {
                if (buffer[offset + i] !== tokenBytes[i]) {
                    return false;
                }
            }
            return true;
        }

        function skipSeparators(buffer, offset) {
            while (offset < buffer.length && (buffer[offset] === 0x0d || buffer[offset] === 0x0a || buffer[offset] === 0x20)) {
                offset++;
            }
            return offset;
        }

        function applyRefreshPayload(payload) {
            let offset = 0;

            while (offset < payload.length) {
                offset = skipSeparators(payload, offset);
                if (offset >= payload.length) {
                    break;
                }

                if (hasToken(payload, offset, 'bulk')) {
                    offset += 4;
                    offset = skipSeparators(payload, offset);
                    if (offset + 8 > payload.length) {
                        break;
                    }
                    const x = readLe16(payload, offset);
                    const y = readLe16(payload, offset + 2);
                    const width = readLe16(payload, offset + 4);
                    const height = readLe16(payload, offset + 6);
                    offset += 8;

                    const pixelsLength = width * height * 2;
                    if (pixelsLength <= 0 || offset + pixelsLength > payload.length) {
                        break;
                    }
                    renderBulkRegion(x, y, width, height, payload.slice(offset, offset + pixelsLength));
                    offset += pixelsLength;
                    continue;
                }

                if (hasToken(payload, offset, 'fill')) {
                    offset += 4;
                    offset = skipSeparators(payload, offset);
                    if (offset + 10 > payload.length) {
                        break;
                    }
                    const x = readLe16(payload, offset);
                    const y = readLe16(payload, offset + 2);
                    const width = readLe16(payload, offset + 4);
                    const height = readLe16(payload, offset + 6);
                    const color = readLe16(payload, offset + 8);
                    offset += 10;
                    renderFillRegion(x, y, width, height, color);
                    continue;
                }

                while (offset < payload.length && payload[offset] !== 0x0a) {
                    offset++;
                }
                if (offset < payload.length) {
                    offset++;
                }
            }
        }

        async function requestRefreshUpdate() {
            if (!port || refreshInFlight) {
                return;
            }

            refreshInFlight = true;
            try {
                await enqueueIo(async () => {
                    const payload = await sendBinaryCommand('refresh');
                    applyRefreshPayload(payload);
                });
                setStatus(`Screen updated at ${new Date().toLocaleTimeString()}`);
            } catch (error) {
                setStatus(`Refresh failed: ${error.message}`, true);
                stopAutoRefresh();
            } finally {
                refreshInFlight = false;
            }
        }

        async function captureScreenshotPixels() {
            return enqueueIo(async () => {
                await writeCommand('capture');
                await readLine();
                const pixels = await readExact(PIXEL_BYTES);
                consumeOptionalPromptPrefix();
                return pixels;
            });
        }

        async function fetchSdFile(filename) {
            return enqueueIo(async () => {
                await writeCommand(`sd_read ${filename}`);
                await readLine();

                const sizeOrError = await readExact(4);
                if (TEXT_DECODER.decode(sizeOrError) === 'err:') {
                    const message = TEXT_DECODER.decode(await readUntilPrompt()).trim();
                    throw new Error(message || `Cannot read ${filename}`);
                }

                const size = sizeOrError[0] | (sizeOrError[1] << 8) | (sizeOrError[2] << 16) | (sizeOrError[3] << 24);
                const content = await readExact(size);
                consumeOptionalPromptPrefix();
                return content;
            });
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function withAutoRefreshPaused(action) {
            const wasAutoRunning = Boolean(autoTimer);
            if (wasAutoRunning) {
                stopAutoRefresh();
            }

            try {
                return await action();
            } finally {
                if (wasAutoRunning && port) {
                    startAutoRefresh();
                    void requestRefreshUpdate();
                }
            }
        }

        function getTouchPoint(event) {
            const rect = canvas.getBoundingClientRect();
            const relativeX = (event.clientX - rect.left) / rect.width;
            const relativeY = (event.clientY - rect.top) / rect.height;
            const x = Math.max(0, Math.min(SCREEN_WIDTH - 1, Math.round(relativeX * (SCREEN_WIDTH - 1))));
            const y = Math.max(0, Math.min(SCREEN_HEIGHT - 1, Math.round(relativeY * (SCREEN_HEIGHT - 1))));
            return { x, y };
        }

        async function sendTouchPress(event) {
            if (!port) {
                return;
            }
            const { x, y } = getTouchPoint(event);
            try {
                await enqueueIo(async () => {
                    await sendConsoleCommand(`touch ${x} ${y}`);
                });
            } catch (error) {
                setStatus(`Touch press failed: ${error.message}`, true);
            }
        }

        async function sendTouchRelease() {
            if (!port) {
                return;
            }

            try {
                await enqueueIo(async () => {
                    await sendConsoleCommand('release');
                });
            } catch (error) {
                setStatus(`Touch release failed: ${error.message}`, true);
            }
        }

        function startAutoRefresh() {
            const interval = Math.max(200, Number(intervalInput.value) || 1000);
            intervalInput.value = String(interval);
            autoTimer = setInterval(() => {
                void requestRefreshUpdate();
            }, interval);
            toggleAutoBtn.textContent = 'Stop auto refresh';
        }

        function stopAutoRefresh() {
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
            toggleAutoBtn.textContent = 'Start auto refresh';
        }

        async function connect() {
            if (!navigator.serial) {
                setStatus('WebSerial API is not available in this browser.', true);
                return;
            }

            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                reader = port.readable.getReader();
                writer = port.writable.getWriter();
                readBuffer = new Uint8Array(0);

                const info = await enqueueIo(async () => sendConsoleCommand('info'));
                if (!info.toLowerCase().includes('tinysa ultra')) {
                    setStatus('Connected device does not report tinySA ULTRA in info output.', true);
                    await disconnect(true);
                    return;
                }
                setStatus('Connected to tinySA ULTRA.');

                setConnectedUi(true);
                await requestRefreshUpdate();
            } catch (error) {
                setStatus(`Connect failed: ${error.message}`, true);
                await disconnect(true);
            }
        }

        async function disconnect(keepStatus = false) {
            if (disconnectPromise) {
                await disconnectPromise;
                return;
            }

            disconnectPromise = (async () => {
                stopAutoRefresh();
                setConnectedUi(false);

                const activeReader = reader;
                const activeWriter = writer;
                const activePort = port;

                reader = null;
                writer = null;
                port = null;
                readBuffer = new Uint8Array(0);
                ioQueueTail = Promise.resolve();
                touchMoveInFlight = false;

                try {
                    if (activeReader) {
                        await activeReader.cancel();
                        activeReader.releaseLock();
                    }
                } catch (error) {
                    console.warn(error);
                }

                try {
                    if (activeWriter) {
                        activeWriter.releaseLock();
                    }
                } catch (error) {
                    console.warn(error);
                }

                try {
                    if (activePort) {
                        await activePort.close();
                    }
                } catch (error) {
                    console.warn(error);
                }

                if (!keepStatus) {
                    setStatus('WebSerial disconnected.');
                }
            })();

            try {
                await disconnectPromise;
            } finally {
                disconnectPromise = null;
            }
        }

        connectBtn.addEventListener('click', () => {
            void connect();
        });

        disconnectBtn.addEventListener('click', () => {
            void disconnect();
        });

        refreshBtn.addEventListener('click', () => {
            void requestRefreshUpdate();
        });

        toggleAutoBtn.addEventListener('click', () => {
            if (autoTimer) {
                stopAutoRefresh();
            } else {
                startAutoRefresh();
                void requestRefreshUpdate();
            }
        });

        downloadCaptureBtn.addEventListener('click', () => {
            void withAutoRefreshPaused(async () => {
                const pixels = await captureScreenshotPixels();
                renderRgb565(pixels);

                const blob = await new Promise((resolve, reject) => {
                    canvas.toBlob((result) => {
                        if (result) {
                            resolve(result);
                        } else {
                            reject(new Error('Cannot create screenshot file'));
                        }
                    }, 'image/png');
                });

                triggerDownload(blob, `tinysa-capture-${Date.now()}.png`);
                setStatus('Screenshot downloaded.');
            }).catch((error) => {
                setStatus(`Screenshot download failed: ${error.message}`, true);
            });
        });

        downloadTraceBtn.addEventListener('click', () => {
            void withAutoRefreshPaused(async () => {
                const filename = traceNameInput.value.trim();
                if (!filename) {
                    throw new Error('Trace file name is required');
                }
                const content = await fetchSdFile(filename);
                triggerDownload(new Blob([content], { type: 'application/octet-stream' }), filename);
                setStatus(`Trace file ${filename} downloaded.`);
            }).catch((error) => {
                setStatus(`Trace download failed: ${error.message}`, true);
            });
        });

        applySweepBtn.addEventListener('click', () => {
            void withAutoRefreshPaused(async () => {
                const start = Math.floor(Number(startFreqInput.value));
                const stop = Math.floor(Number(stopFreqInput.value));
                const rbw = Math.floor(Number(rbwInput.value));

                if (!Number.isFinite(start) || !Number.isFinite(stop) || !Number.isFinite(rbw)) {
                    throw new Error('Sweep settings must be numeric');
                }
                if (start <= 0 || stop <= 0 || rbw <= 0) {
                    throw new Error('Sweep settings must be positive');
                }
                if (stop < start) {
                    throw new Error('Stop frequency must be greater than or equal to start frequency');
                }

                await enqueueIo(async () => {
                    await sendConsoleCommand(`frequencies ${start} ${stop}`);
                    await sendConsoleCommand(`rbw ${rbw}`);
                });

                setStatus('Sweep settings applied.');
            }).catch((error) => {
                setStatus(`Sweep update failed: ${error.message}`, true);
            });
        });

        canvas.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) {
                return;
            }
            canvas.setPointerCapture(event.pointerId);
            void sendTouchPress(event);
        });

        canvas.addEventListener('pointermove', (event) => {
            if ((event.buttons & 1) !== 1) {
                return;
            }

            const now = Date.now();
            if (touchMoveInFlight || now - lastTouchMoveAt < TOUCH_MOVE_INTERVAL_MS) {
                return;
            }

            touchMoveInFlight = true;
            lastTouchMoveAt = now;
            void sendTouchPress(event).finally(() => {
                touchMoveInFlight = false;
            });
        });

        canvas.addEventListener('pointerup', () => {
            void sendTouchRelease();
        });

        canvas.addEventListener('pointercancel', () => {
            void sendTouchRelease();
        });

        canvas.addEventListener('pointerleave', () => {
            void sendTouchRelease();
        });

        setConnectedUi(false);
    </script>
</body>
</html>
