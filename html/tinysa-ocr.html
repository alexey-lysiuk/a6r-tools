<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tinySA Ultra Screenshot OCR</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --body-bg:      #1e1e1e;
            --text:         #e0e0e0;
            --heading:      #c0c0c0;
            --muted:        #888;
            --input-bg:     #252525;
            --input-border: #404040;
            --btn-bg:       #383838;
            --btn-text:     #d0d0d0;
            --btn-hover:    #484848;
            --link:         #8ab4f8;
            --hl:           rgba(255,255,255,0.1);
        }

        body.light {
            --body-bg:      #f0f2f5;
            --text:         #303848;
            --heading:      #1a3a6e;
            --muted:        #606878;
            --input-bg:     #ffffff;
            --input-border: #b0bcc8;
            --btn-bg:       #3060a0;
            --btn-text:     #ffffff;
            --btn-hover:    #204080;
            --link:         #204080;
            --hl:           rgba(0,0,0,0.08);
        }

        body { font-family: sans-serif; background: var(--body-bg); color: var(--text); margin: 0; padding: 16px; }
        h1 { font-size: 1.3em; color: var(--heading); margin: 0; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .header button { margin-left: auto; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        button { background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--input-border);
            border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 0.9em; white-space: nowrap; }
        button:hover:not(:disabled) { background: var(--btn-hover); }
        button:disabled { opacity: 0.5; cursor: default; }
        #drop { border: 2px dashed var(--input-border); border-radius: 6px; padding: 14px; color: var(--muted);
            margin-bottom: 12px; text-align: center; }
        #drop.over { border-color: var(--link); color: var(--text); }
        #error { color: #f08080; margin-bottom: 8px; }
        body.light #error { color: #c02020; }
        .layout { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
        canvas { image-rendering: pixelated; border: 1px solid var(--input-border); background: #000; max-width: 100%; }
        #results { flex: 1; min-width: 320px; }
        table { border-collapse: collapse; width: 100%; font-size: 0.9em; }
        th, td { border-bottom: 1px solid var(--input-border); padding: 3px 8px; text-align: left; }
        th { color: var(--muted); }
        td.text { font-family: monospace; white-space: pre; }
        .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; border: 1px solid #666; }
        tr.hl td { background: var(--hl); }
        textarea { width: 100%; height: 140px; background: var(--input-bg); color: var(--text);
            border: 1px solid var(--input-border); font-family: monospace; margin-top: 12px; }
        select, label { color: var(--text); font-size: 0.9em; }
        select { background: var(--input-bg); border: 1px solid var(--input-border); padding: 5px; }
        a { color: var(--link); }
    </style>
</head>
<body>
    <div class="header">
        <h1>tinySA Ultra Screenshot OCR</h1>
        <button id="themeBtn" title="Toggle light/dark theme">☀ Light</button>
    </div>
    <div id="drop">Drop a tinySA capture (PNG, BMP, ...) here, paste it from the clipboard, or choose a file.</div>
    <div class="toolbar">
        <input type="file" id="file" accept="image/*">
        <label>Output
            <select id="format">
                <option value="plain">Plain text</option>
                <option value="tsv">Tab-separated</option>
                <option value="json">JSON</option>
            </select>
        </label>
        <button id="copy" disabled>Copy</button>
    </div>
    <div id="error"></div>
    <div class="layout">
        <canvas id="canvas" width="480" height="320"></canvas>
        <div id="results">
            <table id="table" hidden>
                <thead><tr><th>Region</th><th>X</th><th>Y</th><th>Color</th><th>Text</th></tr></thead>
                <tbody></tbody>
            </table>
            <textarea id="output" readonly hidden></textarea>
        </div>
    </div>

const MIN_QUALITY = 0.85;
const FONT_START_CHAR = 0x16;
// Chart grid and trigger level lines show through marker texts, they are not ink
const MARKER_IGNORED_COLORS = [0x848284, 0x0000FF];

function loadFont(bits, height) {
    const font = { height, spaceWidth: 4, glyphs: [] };

    for (let i = 0, count = bits.length / height; i < count; ++i) {
        const code = FONT_START_CHAR + i;
        const width = 8 - (bits[i * height] & 7);

        if (code === 0x20) font.spaceWidth = width;
        // Skip icons and space; 'O' is identical to '0' and is resolved by resolveZeroO()
        if (code <= 0x20 || code > 0x7E || code === 0x4F) continue;

        const rows = new Uint8Array(height);
        let ink = 0;

        for (let r = 0; r < height; ++r) {
            rows[r] = bits[i * height + r] & (0xFF << (8 - width)) & 0xFF;
            for (let c = 0; c < width; ++c) ink += (rows[r] >> (7 - c)) & 1;
        }

        if (ink > 0) font.glyphs.push({ ch: String.fromCharCode(code), width, ink, rows });
    }

    return font;
}

function colorName(r, g, b) {
    const maxc = Math.max(r, g, b);
    const delta = maxc - Math.min(r, g, b);

    if (delta * 4 < maxc) return maxc >= 192 ? 'white' : 'gray';

    let hue;
    if (maxc === r) hue = 60 * ((g - b) / delta);
    else if (maxc === g) hue = 60 * ((b - r) / delta + 2);
    else hue = 60 * ((r - g) / delta + 4);
    if (hue < 0) hue += 360;

    if (hue < 15 || hue >= 330) return 'red';
    if (hue < 45) return 'orange';
    if (hue < 75) return 'yellow';
    if (hue < 165) return 'green';
    if (hue < 200) return 'cyan';
    if (hue < 260) return 'blue';
    return 'magenta';
}

class Recognizer {
    constructor(image, region) {
        this.image = image;
        this.region = region;
        this.font = region.font;
        this.computeInk();
    }

    computeInk() {
        const { width, data } = this.image;
        const { x0, y0, x1, y1, ignoredColors } = this.region;
        const histogram = new Map();

        for (let y = y0; y < y1; ++y) {
            for (let x = x0; x < x1; ++x) {
                const i = (y * width + x) * 4;
                const key = (data[i] << 16) | (data[i + 1] << 8) | data[i + 2];
                histogram.set(key, (histogram.get(key) || 0) + 1);
            }
        }

        let best = 0, bestCount = -1;
        for (const [key, count] of histogram) {
            if (count > bestCount) { bestCount = count; best = key; }
        }

        const br = best >> 16, bg = (best >> 8) & 255, bb = best & 255;
        this.ink = new Uint8Array(width * this.image.height);

        for (let y = y0; y < y1; ++y) {
            for (let x = x0; x < x1; ++x) {
                const i = (y * width + x) * 4;
                const r = data[i], g = data[i + 1], b = data[i + 2];
                if (ignoredColors.includes((r << 16) | (g << 8) | b)) continue;
                const diff = Math.abs(r - br) + Math.abs(g - bg) + Math.abs(b - bb);
                this.ink[y * width + x] = diff >= INK_THRESHOLD ? 1 : 0;
            }
        }
    }

    isInk(x, y) { return this.ink[y * this.image.width + x] === 1; }

    rowInk(y) {
        let count = 0;
        for (let x = this.region.x0; x < this.region.x1; ++x) count += this.isInk(x, y);
        return count;
    }

    columnInk(x, top) {
        let count = 0;
        for (let r = 0; r < this.font.height; ++r) count += this.isInk(x, top + r);
        return count;
    }

    matches(glyph, x, top) {
        if (x + glyph.width > this.region.x1) return false;

        for (let r = 0; r < this.font.height; ++r) {
            for (let c = 0; c < glyph.width; ++c) {
                if (((glyph.rows[r] >> (7 - c)) & 1) !== (this.isInk(x + c, top + r) ? 1 : 0)) return false;
            }
        }

        return true;
    }

    cellColor(x, width, top) {
        let r = 0, g = 0, b = 0, count = 0;
        const { data, width: imgWidth } = this.image;

        for (let row = 0; row < this.font.height; ++row) {
            for (let c = 0; c < width; ++c) {
                if (this.isInk(x + c, top + row)) {
                    const i = ((top + row) * imgWidth + x + c) * 4;
                    r += data[i]; g += data[i + 1]; b += data[i + 2];
                    ++count;
                }
            }
        }

        return count > 0 ? colorName(Math.trunc(r / count), Math.trunc(g / count), Math.trunc(b / count)) : 'white';
    }

    run() {
        const result = [];
        const rg = this.region;
        const fontHeight = this.font.height;
        let y = rg.y0;

        while (y < rg.y1) {
            if (this.rowInk(y) === 0) { ++y; continue; }

            // Top ink row may belong to any glyph row, so try all line positions
            const lastTop = rg.y1 - fontHeight;
            let bestTop = -1, bestScore = 0, bestTokens = [], bestQuality = 0;

            for (let top = Math.max(rg.y0, y - (fontHeight - 1)); top <= Math.min(y, lastTop); ++top) {
                const line = this.decodeLine(top);
                if (line.score > bestScore) {
                    bestScore = line.score;
                    bestTop = top;
                    bestTokens = line.tokens;
                    bestQuality = line.quality;
                }
            }

            if (bestTop < 0 || bestQuality < MIN_QUALITY) { ++y; continue; }

            this.splitTexts(bestTop, bestTokens, result);
            y = bestTop + fontHeight;
        }

        return result;
    }

        const n = this.region.x1 - x0;

        let totalInk = 0;

            colInk[i] = this.columnInk(x0 + i, top);
            totalInk += colInk[i];
        }

            for (let i = from; i < from + count; ++i) if (colInk[i] > 0) return true;
            return false;
        };

            const base = nodes[i].score;
            const step = nodes[i + 1];
            const stepScore = base - 2 * colInk[i];

            if (stepScore > step.score || (colInk[i] === 0 && stepScore >= step.score)) {
                step.score = stepScore;
                step.prev = i;
                step.glyph = null;
                step.unknown = colInk[i] > 0;
            }

            // Glyph cell may start with blank columns, so only skip fully blank cells
            for (const glyph of this.font.glyphs) {
                if (i + glyph.width <= n && this.matches(glyph, x0 + i, top) && anyInk(i, glyph.width)) {
                    const next = nodes[i + glyph.width];
                    const score = base + glyph.ink;

                    if (score > next.score) {
                        next.score = score;
                        next.prev = i;
                        next.glyph = glyph;
                        next.unknown = false;
                    }
                }
            }
        }

        let end = 0;
        for (let i = 0; i <= n; ++i) if (nodes[i].score >= nodes[end].score) end = i;

        const total = nodes[end].score;
        let matchedInk = 0;
        const tokens = [];

        for (let i = end; i > 0 && nodes[i].prev >= 0;) {
            const node = nodes[i];
            const from = node.prev;

            if (node.glyph) {
                matchedInk += node.glyph.ink;
                tokens.push({ x: x0 + from, width: node.glyph.width, ch: node.glyph.ch,
                    color: this.cellColor(x0 + from, node.glyph.width, top) });
            } else if (node.unknown) {
                tokens.push({ x: x0 + from, width: 1, ch: '?', color: this.cellColor(x0 + from, 1, top) });
            }

            i = from;
        }

        tokens.reverse();
        return { score: matchedInk > 0 ? total : 0, tokens, quality: matchedInk / totalInk };
    }

    // Glyphs of '0' and 'O' are identical, use uppercase neighbors as a hint
    static resolveZeroO(value) {
        const chars = value.split('');
        const numeric = c => /[0-9.]/.test(c);
        const upper = c => /[A-Z]/.test(c);

        for (let i = 0; i < chars.length; ++i) {
            if (chars[i] !== '0') continue;
            const before = i > 0 ? chars[i - 1] : ' ';
            const after = i + 1 < chars.length ? chars[i + 1] : ' ';
            if (!numeric(before) && !numeric(after) && (upper(before) || upper(after))) chars[i] = 'O';
        }

        return chars.join('');
    }

    splitTexts(top, tokens, out) {
        const spaceWidth = this.font.spaceWidth;
        let text = null, prevEnd = 0;

        const flush = () => {
            if (text) {
                text.value = Recognizer.resolveZeroO(text.value);
                out.push(text);
                text = null;
            }
        };

        for (const token of tokens) {
            if (text) {
                const gap = token.x - prevEnd;

                if (gap >= SEGMENT_GAP_SPACES * spaceWidth || token.color !== text.color) {
                    flush();
                } else {
                    text.value += ' '.repeat(Math.trunc((gap + Math.trunc(spaceWidth / 2)) / spaceWidth));
                }
            }

            if (!text) text = { region: this.region.name, x: token.x, y: top, color: token.color, value: '', height: this.font.height, width: 0 };

            // Merge adjacent unrecognized columns
            if (!(token.ch === '?' && text.value.endsWith('?') && token.x === prevEnd)) text.value += token.ch;

            prevEnd = token.x + token.width;
            text.width = prevEnd - text.x;
        }

        flush();
    }
}

function recognize(image) {
    const regions = [
        { name: 'markers', x0: STATUS_COLUMN_WIDTH, y0: 0, x1: image.width, y1: Math.min(MARKER_ROWS_HEIGHT, image.height),
            font: MARKER_FONT, ignoredColors: MARKER_IGNORED_COLORS },
        { name: 'column', x0: 0, y0: 0, x1: STATUS_COLUMN_WIDTH, y1: image.height, font: SMALL_FONT, ignoredColors: [] },
        { name: 'row', x0: STATUS_COLUMN_WIDTH, y0: image.height - STATUS_ROW_HEIGHT, x1: image.width, y1: image.height,
            font: SMALL_FONT, ignoredColors: [] },
    ];

    return regions.flatMap(region => new Recognizer(image, region).run());
}

// ── UI ──────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let texts = [];
let image = null;

const COLOR_CSS = { white: '#fff', gray: '#999', red: '#f44', orange: '#fa0', yellow: '#ee0',
    green: '#4d4', cyan: '#0dd', blue: '#68f', magenta: '#d4d' };

function formatOutput() {
    switch ($('format').value) {
        case 'tsv': return texts.map(t => [t.region, t.x, t.y, t.color, t.value].join('\t')).join('\n');
        case 'json': return JSON.stringify(texts.map(t => ({ region: t.region, x: t.x, y: t.y, color: t.color, text: t.value })), null, 2);
        default: return texts.map(t => t.value).join('\n');
    }
}

function draw(highlight) {
    ctx.putImageData(image, 0, 0);
    if (highlight) {
        ctx.strokeStyle = '#ff0';
        ctx.strokeRect(highlight.x - 0.5, highlight.y - 0.5, highlight.width + 1, highlight.height + 1);
    }
}

function render() {
    const tbody = $('table').tBodies[0];
    tbody.textContent = '';

    texts.forEach(t => {
        const tr = tbody.insertRow();
        tr.insertCell().textContent = t.region;
        tr.insertCell().textContent = t.x;
        tr.insertCell().textContent = t.y;
        const color = tr.insertCell();
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = COLOR_CSS[t.color];
        color.append(swatch, t.color);
        const text = tr.insertCell();
        text.className = 'text';
        text.textContent = t.value;
        tr.onmouseenter = () => { tr.classList.add('hl'); draw(t); };
        tr.onmouseleave = () => { tr.classList.remove('hl'); draw(); };
    });

    $('table').hidden = false;
    $('output').hidden = false;
    $('output').value = formatOutput();
    $('copy').disabled = texts.length === 0;
}

async function loadBlob(blob) {
    $('error').textContent = '';

    try {
        const bitmap = await createImageBitmap(blob);

        if (bitmap.width <= STATUS_COLUMN_WIDTH || bitmap.height <= STATUS_ROW_HEIGHT * 2) {
            throw new Error(`Image size ${bitmap.width}x${bitmap.height} is too small for a tinySA capture`);
        }

        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        ctx.drawImage(bitmap, 0, 0);
        image = ctx.getImageData(0, 0, bitmap.width, bitmap.height);
        canvas.style.width = bitmap.width * 2 + 'px';
        texts = recognize(image);
        render();
    } catch (e) {
        $('error').textContent = 'Failed to load image: ' + e.message;
    }
}

$('file').onchange = e => { if (e.target.files[0]) loadBlob(e.target.files[0]); };
$('format').onchange = () => { if (image) $('output').value = formatOutput(); };
function applyTheme(light) {
    document.body.classList.toggle('light', light);
    $('themeBtn').textContent = light ? '🌙 Dark' : '☀ Light';
}

$('themeBtn').onclick = () => applyTheme(!document.body.classList.contains('light'));
applyTheme(window.matchMedia('(prefers-color-scheme: light)').matches);

$('copy').onclick = () => navigator.clipboard.writeText($('output').value);

const drop = $('drop');
document.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
document.addEventListener('dragleave', () => drop.classList.remove('over'));
document.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) loadBlob(e.dataTransfer.files[0]);
});
document.addEventListener('paste', e => {
    const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
    if (item) loadBlob(item.getAsFile());
});
</script>
</body>
